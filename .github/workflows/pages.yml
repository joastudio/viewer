name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6
      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5
      - name: 의존성 설치
        run: npm ci
      - name: 정적 사이트 빌드
        run: npm run build
      - name: Pages 산출물 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
